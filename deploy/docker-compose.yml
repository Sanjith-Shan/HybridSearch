# The whole system on one box: 4 shards x 2 replicas, the broker, the web app,
# and the observability stack.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Indexes are built beforehand (scripts/build_serving_indexes.sh) and mounted
# read-only from ../data. Replicas of a slice mmap the same files, so the second
# replica costs almost no extra memory. Chaos control files live in ./chaos and
# are re-read by each shard at runtime (see engine/include/hs/server/chaos.hpp).
#
# Shards are processes on one box on purpose: that is enough to demonstrate every
# reliability behaviour honestly, and it is what the spec asks for.

x-shard: &shard
  build:
    context: ..
    dockerfile: engine/Dockerfile
  image: hybridsearch/shard
  volumes:
    - ../data:/data:ro
    - ./chaos:/chaos:ro
  restart: unless-stopped
  environment:
    - OTEL_SERVICE_NAME=hs-shard

services:
  shard0a: &s0
    <<: *shard
    container_name: hs-shard0a
    command: ["--port", "50051", "--shard-id", "0", "--lexical", "/data/indexes/lexical/1m-4shards/shard0",
              "--vector-disk", "/data/indexes/vector/1m-4shards/shard0",
              "--chaos-file", "/chaos/shard0a", "--otlp", "http://otel-collector:4318"]
  shard0b:
    <<: *s0
    container_name: hs-shard0b
    command: ["--port", "50051", "--shard-id", "0", "--lexical", "/data/indexes/lexical/1m-4shards/shard0",
              "--vector-disk", "/data/indexes/vector/1m-4shards/shard0",
              "--chaos-file", "/chaos/shard0b", "--otlp", "http://otel-collector:4318"]
  shard1a: &s1
    <<: *shard
    container_name: hs-shard1a
    command: ["--port", "50051", "--shard-id", "1", "--lexical", "/data/indexes/lexical/1m-4shards/shard1",
              "--vector-disk", "/data/indexes/vector/1m-4shards/shard1",
              "--chaos-file", "/chaos/shard1a", "--otlp", "http://otel-collector:4318"]
  shard1b:
    <<: *s1
    container_name: hs-shard1b
    command: ["--port", "50051", "--shard-id", "1", "--lexical", "/data/indexes/lexical/1m-4shards/shard1",
              "--vector-disk", "/data/indexes/vector/1m-4shards/shard1",
              "--chaos-file", "/chaos/shard1b", "--otlp", "http://otel-collector:4318"]
  shard2a: &s2
    <<: *shard
    container_name: hs-shard2a
    command: ["--port", "50051", "--shard-id", "2", "--lexical", "/data/indexes/lexical/1m-4shards/shard2",
              "--vector-disk", "/data/indexes/vector/1m-4shards/shard2",
              "--chaos-file", "/chaos/shard2a", "--otlp", "http://otel-collector:4318"]
  shard2b:
    <<: *s2
    container_name: hs-shard2b
    command: ["--port", "50051", "--shard-id", "2", "--lexical", "/data/indexes/lexical/1m-4shards/shard2",
              "--vector-disk", "/data/indexes/vector/1m-4shards/shard2",
              "--chaos-file", "/chaos/shard2b", "--otlp", "http://otel-collector:4318"]
  shard3a: &s3
    <<: *shard
    container_name: hs-shard3a
    command: ["--port", "50051", "--shard-id", "3", "--lexical", "/data/indexes/lexical/1m-4shards/shard3",
              "--vector-disk", "/data/indexes/vector/1m-4shards/shard3",
              "--chaos-file", "/chaos/shard3a", "--otlp", "http://otel-collector:4318"]
  shard3b:
    <<: *s3
    container_name: hs-shard3b
    command: ["--port", "50051", "--shard-id", "3", "--lexical", "/data/indexes/lexical/1m-4shards/shard3",
              "--vector-disk", "/data/indexes/vector/1m-4shards/shard3",
              "--chaos-file", "/chaos/shard3b", "--otlp", "http://otel-collector:4318"]

  broker:
    build:
      context: ../broker
    image: hybridsearch/broker
    container_name: hs-broker
    ports: ["8080:8080"]
    volumes:
      - ../data:/data
    environment:
      - Broker__DataRoot=/data
      - Broker__Topology__Slices__0__Id=0
      - Broker__Topology__Slices__0__Replicas__0=http://shard0a:50051
      - Broker__Topology__Slices__0__Replicas__1=http://shard0b:50051
      - Broker__Topology__Slices__1__Id=1
      - Broker__Topology__Slices__1__Replicas__0=http://shard1a:50051
      - Broker__Topology__Slices__1__Replicas__1=http://shard1b:50051
      - Broker__Topology__Slices__2__Id=2
      - Broker__Topology__Slices__2__Replicas__0=http://shard2a:50051
      - Broker__Topology__Slices__2__Replicas__1=http://shard2b:50051
      - Broker__Topology__Slices__3__Id=3
      - Broker__Topology__Slices__3__Replicas__0=http://shard3a:50051
      - Broker__Topology__Slices__3__Replicas__1=http://shard3b:50051
      - Broker__Cors__AllowedOrigins__0=http://localhost:8081
      - Broker__Cors__AllowedOrigins__1=http://localhost:5173
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=hs-broker
    depends_on: [shard0a, shard0b, shard1a, shard1b, shard2a, shard2b, shard3a, shard3b, otel-collector]

  web:
    build:
      context: ../web
    image: hybridsearch/web
    container_name: hs-web
    ports: ["8081:80"]
    depends_on: [broker]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: hs-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: hs-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: hs-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/slo_rules.yml:/etc/prometheus/slo_rules.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: hs-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
