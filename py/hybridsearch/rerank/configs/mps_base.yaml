# Small, real MPS training used for the M5 ablations on the laptop (M3 Pro, 18 GB).
# Only `strategy` (and out_dir/label) differ between the ablation runs; see mps_*.yaml.
base_model: nreimers/MiniLM-L6-H384-uncased
loss: listwise
n_neg: 7              # group = 1 positive + 7 negatives = 8 pairs
batch_groups: 4       # micro-batch 32 pairs (MPS memory: attention activations scale with pairs x len^2)
grad_accum: 4         # effective 16 groups = 128 pairs per optimizer step
lr: 3.0e-5
weight_decay: 0.01
warmup_frac: 0.1
max_steps: 2000
max_len: 192          # training only (eval 512): attention activations on MPS ~ pairs x len^2, measured 3.25 GB at 32x256
pool_depth: 20       # negatives sampled from the top-20 of each filtered pool (memory: the laptop is swapping)
seed: 20260923
device: mps
amp: none             # fp32 on MPS
mined: data/rerank/mined/train50k.jsonl
queries: data/subset/train50k/queries.tsv
qrels: data/subset/train50k/qrels.tsv
val_run: data/runs/reference/anserini-bm25-default.train_tune.trec
val_queries: data/subset/train_tune/queries.tsv
val_qrels: data/subset/train_tune/qrels.tsv
val_n: 500
val_depth: 30
eval_every: 500
save_every: 250
log_every: 50
